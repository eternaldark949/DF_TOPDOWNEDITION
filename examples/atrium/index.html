<!doctype html>
<!-- Atrium page: accessible HTML interface around a pure WebGL world. No external assets. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10101b">
<title>ETRNLNINE · The First Atrium</title>
<style>
/* Page presentation belongs to the example. Control classes style reusable template instances. */
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10101b;color:#e5ded4;font-family:system-ui,sans-serif}
#world{display:block;width:100%;height:100%;touch-action:none;outline:none}
header{position:absolute;top:max(30px,env(safe-area-inset-top));left:36px;pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.3em;color:#baa78a;text-transform:uppercase}
h1{font-family:Georgia,serif;font-size:clamp(30px,4vw,58px);font-weight:400;margin:12px 0 8px;letter-spacing:-.03em}
.subtitle{font-size:12px;color:#a7a4b9;max-width:270px;line-height:1.7}
nav{position:absolute;top:max(30px,env(safe-area-inset-top));right:30px;display:flex;gap:8px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid #92816a55;background:#161622cf;border-radius:5px;padding:10px 16px;touch-action:none}
button:focus-visible{outline:2px solid #d7b97b;outline-offset:4px}button:hover{background:#33303d}button.held{background:#786145}
footer{position:absolute;bottom:max(25px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);text-align:center;width:min(65%,600px);pointer-events:none}
#status{display:block;font-size:10px;color:#c0af94;letter-spacing:.08em;margin-bottom:10px}
.hint{font-size:11px;line-height:1.7;color:#9693a9}kbd{font:inherit;color:#d2c6b2}
.engine-joystick{position:absolute;left:max(28px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));border:1px solid #b8a17c4d;border-radius:50%;background:#17172488;touch-action:none;display:grid;place-items:center}
.engine-joystick span{width:38px;height:38px;border-radius:50%;border:1px solid #cbb58a80;background:#7d6c4e50;pointer-events:none}
.engine-action{position:absolute;right:max(40px,env(safe-area-inset-right));bottom:max(46px,env(safe-area-inset-bottom));border-radius:50%;font-size:11px;letter-spacing:.1em;padding:0}
#error{position:absolute;top:40%;left:10%;width:80%;padding:24px;border:1px solid #bf8a6e;background:#241b24;z-index:3}
@media(max-width:650px){header{left:20px;top:22px}.subtitle{max-width:180px;font-size:10px}nav{right:15px;top:24px}nav button{padding:9px;font-size:11px}h1{font-size:30px}.eyebrow{font-size:8px}footer{bottom:150px;width:90%}.hint{font-size:10px}.engine-joystick{left:22px}.engine-action{right:25px}}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="Interactive WebGL courtyard. Use WASD or arrows to walk, E to change the lantern, B to change the pack response."></canvas>
<header><div class="eyebrow">ETRNLNINE / First light</div><h1>The First Atrium</h1><div class="subtitle">A house begins with its foundation.<br>A world begins with a little movement.</div></header>
<nav aria-label="Demonstration controls"><button id="pause" aria-pressed="false">Pause</button><button id="restart">New scene</button></nav>
<div id="controls" aria-label="Touch controls"></div>
<footer><output id="status" aria-label="Engine status">Opening the house…</output><div class="hint"><kbd>WASD / arrows</kbd> walk &nbsp;·&nbsp; <kbd>mouse</kbd> look &nbsp;·&nbsp; <kbd>E / click</kbd> light &nbsp;·&nbsp; <kbd>B</kbd> pack<br>Touch controls available · Gamepad: left stick / A / X</div></footer>
<div id="error" role="alert" hidden></div>
<script type="module" src="./main.js"></script>
</body>
</html>
