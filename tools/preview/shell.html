<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Engine Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Great+Vibes&family=Montserrat:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; --ink: #efe6ff; --dim: #a99cc4; --panel: rgba(14, 10, 24, .78); --edge: rgba(154, 107, 255, .35); --accent: #9a6bff; --bg: #07060b; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.35 Montserrat, system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
.bar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.bar > * { pointer-events: auto; }
.chip { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 6px 10px; display: flex; gap: 6px; align-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.chip b { font-weight: 800; letter-spacing: .02em; }
.chip .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
select, button { font: inherit; color: var(--ink); background: rgba(255, 255, 255, .06); border: 1px solid var(--edge); border-radius: 7px; padding: 4px 8px; }
select { max-width: 52vw; }
select option { background: #1a1328; }
button { cursor: pointer; min-width: 32px; }
button:hover { background: rgba(154, 107, 255, .22); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#where { font-family: Cinzel, Georgia, serif; font-weight: 600; font-size: 15px; }
#clock { font-family: Orbitron, monospace; font-weight: 700; min-width: 48px; text-align: center; }
#prompt { position: fixed; left: 50%; bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px)); transform: translateX(-50%); display: none; gap: 10px; align-items: center; padding: 10px 16px; font-weight: 600; font-size: 15px; cursor: pointer; border-color: var(--accent); box-shadow: 0 0 24px rgba(123, 61, 255, .45); }
#prompt.show { display: flex; }
#prompt kbd { font: 700 12px Orbitron, monospace; background: var(--accent); color: #fff; border-radius: 5px; padding: 2px 7px; }
#prompt.locked { opacity: .6; border-color: var(--edge); box-shadow: none; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .18s; }
#fade.on { opacity: 1; }
#help { position: fixed; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); color: var(--dim); font-size: 12px; max-width: 46vw; }
#err { position: fixed; right: 12px; bottom: 12px; max-width: 60vw; color: #ffb3c1; font-size: 12px; white-space: pre-wrap; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: Cinzel, serif; font-size: 20px; letter-spacing: .1em; color: var(--dim); }
/* Touch: a stick on the left half, the use button on the right. */
#stick { position: fixed; left: 0; bottom: 0; width: 50vw; height: 55vh; display: none; }
#knob { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(154, 107, 255, .35); border: 2px solid rgba(239, 230, 255, .6); left: 25vw; top: 60%; pointer-events: none; }
#use { position: fixed; right: 24px; bottom: max(90px, calc(env(safe-area-inset-bottom) + 80px)); width: 72px; height: 72px; border-radius: 50%; display: none; font-weight: 800; background: rgba(154, 107, 255, .4); }
body.touch #stick, body.touch #use { display: block; }
body.touch #help { display: none; }
@media (max-width: 640px) { .chip { padding: 5px 7px; } .hide-sm { display: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="The map, drawn by the engine"></canvas>
<div id="loading">Loading the city…</div>
<div class="bar">
  <div class="chip"><span class="k hide-sm">Map</span><select id="maps" aria-label="Map"></select></div>
  <div class="chip hide-sm"><span id="where">—</span></div>
  <div class="chip"><span id="clock">--:--</span>
    <button data-time="08:00" title="Morning">☀</button><button data-time="18:30" title="Dusk">◐</button><button data-time="23:00" title="Night">☾</button>
    <button id="fast" title="Run the clock fast" class="hide-sm">⏩</button></div>
  <div class="chip"><span class="k hide-sm">Sky</span>
    <button data-weather="clear">Clear</button><button data-weather="rain">Rain</button><button data-weather="snow">Snow</button></div>
  <div class="chip"><button id="zout" aria-label="Zoom out">−</button><span id="zoom">1×</span><button id="zin" aria-label="Zoom in">+</button></div>
  <div class="chip hide-sm"><select id="renderer" aria-label="Renderer"><option value="canvas">Canvas</option><option value="webgl">WebGL</option></select><span id="fps" class="k">— fps</span></div>
</div>
<div id="prompt" class="chip"><kbd>E</kbd><span id="exit-label"></span></div>
<div id="help">WASD or arrows to walk, Shift to run, E to use an exit, + and − to zoom. A gamepad works too.</div>
<div id="stick"><div id="knob"></div></div>
<button id="use" aria-label="Use">USE</button>
<div id="fade"></div>
<div id="err"></div>
<!--PREVIEW-->
</body>
</html>
