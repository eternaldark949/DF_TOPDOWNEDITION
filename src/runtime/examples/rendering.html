<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared rendering contract</title>
<style>body{background:#171b28;color:#fff;font:16px system-ui;margin:20px}canvas{display:block;width:320px;height:240px;outline:1px solid #888}</style>
<h1>Shared rendering contract</h1><p>Cached geometry, image data, gradients, clipping, text, shadows, a rotated camera and an offscreen pass.</p>
<canvas id="scene" width="320" height="240"></canvas><pre id="status"></pre>
<script type="module">
import {createRuntimeExample} from '../../directory/runtime-example.mjs';
import {installRenderingExample} from '../../directory/rendering-example.mjs';
const surface=document.getElementById('scene');
const {engine,player}=createRuntimeExample({surface,camera:{position:[0,0],zoom:2,rotation:Math.PI/2,viewport:{width:320,height:240,pixel_ratio:devicePixelRatio}}});
await engine.api.render.setRenderer('canvas',{surface});
await engine.loadLevel('room_a');await installRenderingExample(engine);
engine.registerSystem('status',{render(context){document.getElementById('status').textContent=JSON.stringify({renderer:context.api.render.renderer_id,...context.api.render.getStatistics()},null,2);}});
engine.start();globalThis.renderingExample={engine,player};
</script></html>
