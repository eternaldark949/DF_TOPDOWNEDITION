<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120f1a"><title>Freelancer · Enni Cole</title>
<style>
/* Game presentation owns these elements; engine controls receive a host and parameters. */
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d18;color:#eadfc9;font:13px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}header{position:absolute;top:0;left:0;right:0;padding:22px 28px;background:linear-gradient(#100c19ee,transparent);pointer-events:none}header small{display:block;color:#bca075;font:10px monospace;letter-spacing:.26em}h1{font:34px Georgia,serif;font-weight:400;letter-spacing:.12em;margin:8px 0}#subtitle{font:11px Georgia,serif;color:#bcb0bf;letter-spacing:.07em}nav{position:absolute;top:25px;right:25px;display:flex;gap:7px}button,select{color:#d8c6a4;background:#17111fe8;border:1px solid #5b4552;border-radius:4px;min-height:42px;padding:8px 11px;font:11px system-ui}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #cba8ee}#prompt{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);text-align:center;font:12px Georgia,serif;letter-spacing:.05em;padding:12px 20px;background:#17101be6;border:1px solid #72533e;border-radius:4px;max-width:calc(100% - 220px)}#controls{position:absolute;inset:0;pointer-events:none}#controls>*{pointer-events:auto}.engine-joystick{position:absolute;left:30px;bottom:32px;border:1px solid #c2a16c77;border-radius:50%;background:#1c1428a8;touch-action:none;display:grid;place-items:center}.engine-joystick span{width:34px;height:34px;border-radius:50%;border:1px solid #cbb58a80;background:#8d735770;pointer-events:none}.engine-action{position:absolute;right:30px;bottom:40px;border-radius:50%;padding:0;border-color:#ae8758;background:#201728d9}#status{position:absolute;left:28px;bottom:9px;font:9px monospace;color:#a89bb5;pointer-events:none}#error{position:absolute;left:20px;right:20px;top:130px;padding:18px;background:#542433;z-index:9}.etrnl-profiler:not([open]){display:none}body.paused #prompt::after{content:' · Paused'}
@media(max-width:650px){header{padding:18px}h1{font-size:25px}nav{top:98px;left:18px;right:auto}nav>*{padding:6px 9px;min-height:38px;font-size:10px}#prompt{bottom:148px;max-width:90%;width:max-content;font-size:11px}#status{left:18px;font-size:8px}.engine-joystick{left:24px;bottom:30px}.engine-action{right:24px;bottom:42px}#subtitle{font-size:10px}}
</style></head><body>
<canvas id="world" tabindex="0" aria-label="Freelancer WebGL street scene. Walk using WASD, arrows or the touch stick. E interacts near a doorway."></canvas>
<header><small>FREELANCER / ETRNLNINE</small><h1>ENNI COLE</h1><div id="subtitle">Clinic Way · rose stone / champagne brass</div></header>
<nav aria-label="Game options"><button id="pause">Pause</button><button id="restart">Restart</button><select id="quality" aria-label="Lighting quality"><option value="mobile">Soft lighting</option><option value="fine">Fine contacts</option><option value="off">Low power</option></select><button id="profiler">Profiler</button></nav>
<div id="controls"></div><output id="prompt">Opening Clinic Way…</output><output id="status" aria-live="off"></output><div id="error" role="alert" hidden></div>
<script type="module" src="./main.js"></script></body></html>
