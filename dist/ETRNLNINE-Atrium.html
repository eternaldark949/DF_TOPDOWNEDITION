/**
 * Basement / world: identity, transforms, attachments, and spatial membership.
 * Coordinates: x/y are horizontal world units; z is elevation; yaw is radians.
 * A world owns its entities. Identity is immutable and independent of array position.
 * This first representation supports yaw/local translation, not a skeletal solver.
 */
class Identities {
  /** Engine-local monotonically increasing IDs; caller chooses the namespace. */
  constructor() { this.next = 1; }
  /** IDs are never reused during this engine's lifetime, even after scene disposal. */
  create(namespace) { return `${namespace}:${this.next++}`; }
}

class World {
  /** Construct an empty world with an explicitly shared identity allocator. */
  constructor(id, identities) {
    this.id = id;
    this.identities = identities;
    this.entities = new Map();
    this.revision = 0;
    this.disposed = false;
  }

  /**
   * Add one entity. Shape is optional; invisible anchors allocate no GPU geometry.
   * Parent must already exist in this world: this prevents cycles and foreign links.
   * Shape size is full width/depth/height; its origin is its center.
   */
  create({ x = 0, y = 0, z = 0, yaw = 0, parent = null, shape = null } = {}) {
    if (this.disposed) throw new Error('Cannot create in a disposed world');
    if (parent && this.entities.get(parent.id) !== parent) throw new Error('Parent belongs to another world');
    const entity = {
      id: this.identities.create('entity'), worldId: this.id, parent,
      x, y, z, yaw, previous: { x, y, z, yaw },
      pose: { x, y, z, yaw }, shape,
    };
    this.entities.set(entity.id, entity);
    this.revision++;
    return entity;
  }

  /** Capture local transforms before a fixed update, for smooth render interpolation. */
  snapshot() {
    for (const e of this.entities.values()) {
      e.previous.x = e.x; e.previous.y = e.y;
      e.previous.z = e.z; e.previous.yaw = e.yaw;
    }
  }

  /**
   * Resolve interpolated world transforms in insertion order, without per-frame objects.
   * Parent-before-child is guaranteed by create(); shortest-arc yaw avoids full spins.
   */
  resolve(alpha = 1) {
    for (const e of this.entities.values()) {
      const a = e.previous, p = e.pose;
      const x = a.x + (e.x - a.x) * alpha;
      const y = a.y + (e.y - a.y) * alpha;
      const z = a.z + (e.z - a.z) * alpha;
      const turn = Math.atan2(Math.sin(e.yaw - a.yaw), Math.cos(e.yaw - a.yaw));
      const yaw = a.yaw + turn * alpha;
      if (e.parent) {
        const b = e.parent.pose, c = Math.cos(b.yaw), s = Math.sin(b.yaw);
        p.x = b.x + x * c - y * s; p.y = b.y + x * s + y * c;
        p.z = b.z + z; p.yaw = b.yaw + yaw;
      } else { p.x = x; p.y = y; p.z = z; p.yaw = yaw; }
    }
  }

  /** Remove an entity and descendants; snapshot the map so recursive removal is safe. */
  remove(entity) {
    if (this.entities.get(entity.id) !== entity) return;
    for (const child of [...this.entities.values()]) if (child.parent === entity) this.remove(child);
    this.entities.delete(entity.id);
    this.revision++;
  }

  /** Release CPU membership; Directory separately owns GPU/resource leases. */
  dispose() {
    if (this.disposed) return;
    this.entities.clear(); this.revision++; this.disposed = true;
  }
}

return {Identities,World};

/**
 * Basement / lifetime: an explicit owner for cleanup callbacks.
 * It knows no game, scheduler, or DOM IDs. Owners release children in reverse order,
 * so a control can release its listeners before the resources it references vanish.
 */
class Lifetime {
  /** Start an empty owner; resources are only allocated by the caller. */
  constructor() { this.cleanups = []; this.disposed = false; }

  /** Register cleanup, returning it for optional manual use. Late additions clean immediately. */
  own(cleanup) {
    if (this.disposed) cleanup();
    else this.cleanups.push(cleanup);
    return cleanup;
  }

  /** Add a browser listener whose exact function/options are remembered for removal. */
  listen(target, type, callback, options) {
    target.addEventListener(type, callback, options);
    this.own(() => target.removeEventListener(type, callback, options));
  }

  /** Release everything once; attempt later cleanups even if one child throws. */
  dispose() {
    if (this.disposed) return;
    this.disposed = true;
    const errors = [];
    for (const cleanup of this.cleanups.reverse()) {
      try { cleanup(); } catch (error) { errors.push(error); }
    }
    this.cleanups.length = 0;
    if (errors.length) throw new AggregateError(errors, 'Lifetime cleanup failed');
  }
}

return {Lifetime};
})();

/**
 * Basement / input: keyboard, pointer, touch-control sources, and gamepad actions.
 * Games supply maps; this module never interprets "move" or "interact" as game rules.
 * Vector sources combine by strongest magnitude (no diagonal/duplicate speed boost).
 * Button sources OR together; press edges are consumed once, even during catch-up.
 */

  /** Bind to the supplied surface/window, and an injectable gamepad reader for tests. */
  constructor(surface, { host = window, gamepads = () => navigator.getGamepads?.() ?? [] } = {}) {
    this.surface = surface; this.host = host; this.gamepads = gamepads;
    this.life = new Lifetime(); this.keys = new Set(); this.pointers = new Set();
    this.map = {}; this.sources = new Map(); this.actions = new Map(); this.pendingPresses = new Set();

    this.suspended = false;
    // Ignore keyboard input intended for editable HTML fields, including on key repeat.

      if (event.target?.closest?.('input,textarea,select,[contenteditable=true]')) return;
      if (this.usesKey(event.code)) event.preventDefault();

      this.pointer.active = true;
    });

    this.life.listen(surface, 'pointercancel', () => this.pointers.clear());
    this.life.listen(surface, 'lostpointercapture', () => this.pointers.clear());

    if (map.keys?.some(key => this.keys.has(key)) || map.pointerButtons?.some(button => this.pointers.has(button))) return true;
    for (const source of this.sources.values()) if (source.action === name && source.x > 0) return true;
    return [...this.gamepads()].some(pad => pad?.connected && map.buttons?.some(button => pad.buttons[button]?.pressed));

          - Number(map.negativeY?.some(k => this.keys.has(k)) ?? false);

          || (map.pointerButtons?.some(b => this.pointers.has(b)) ?? false));
      }

      for (const pad of pads) {
        if (map.kind === 'vector' && map.axes) {
          let px = pad.axes[map.axes[0]] ?? 0, py = pad.axes[map.axes[1]] ?? 0;
          const length = Math.hypot(px, py), dead = map.deadZone ?? 0.18;
          if (length <= dead) { px = 0; py = 0; }

        } else if (map.buttons?.some(b => pad.buttons[b]?.pressed)) x = 1;
      }

        if (map.kind === 'vector') {
          if (Math.hypot(source.x, source.y) > Math.hypot(x, y)) { x = source.x; y = source.y; }
        } else x = Math.max(x, source.x);

  /** Consume a press once. Use this for toggles, not continuously held movement. */

  /** Remove exactly this instance's browser listeners; safe to call more than once. */
  dispose() { if (this.disposed) return; this.clear(); this.life.dispose(); this.disposed = true; }
}

/** Shared read-only fallback; callers must not mutate action state directly. */
const ZERO_ACTION = Object.freeze({ x: 0, y: 0, down: false, pressed: false });

return {Input};
})();

/**
 * Basement / shaders: GPU-native instanced boxes and inexpensive surface lighting.
 * No textures, font atlas, Canvas preparation, post-processing, or external assets.
 * This is the first renderer material, not the final luxe/bloom renderer.
 */

precision highp float;
layout(location=0) in vec3 aPosition;
layout(location=1) in vec3 aNormal;
// Per-instance layout, documented in renderer.js: pose, dimensions/emission, color.
layout(location=2) in vec4 aPose;
layout(location=3) in vec4 aSize;
layout(location=4) in vec4 aColor;
uniform vec4 uCamera; // center x/y, visible half-width/half-height in world units
out vec3 vWorld;
out vec3 vNormal;
out vec3 vColor;
out float vEmission;
void main() {
  float c = cos(aPose.w), s = sin(aPose.w);
  mat2 rotation = mat2(c, s, -s, c);
  vec3 p = aPosition * aSize.xyz;
  p.xy = rotation * p.xy;
  p += aPose.xyz;
  vWorld = p;
  vNormal = vec3(rotation * aNormal.xy, aNormal.z);
  vColor = aColor.rgb;
  vEmission = aSize.w;
  // Orthographic oblique camera. z is height; y is ground depth, never screen pixels.
  vec2 screen = vec2(p.x - uCamera.x, (p.y - uCamera.y) * 0.65 + p.z * 0.76);
  float depth = (p.y - uCamera.y) * 0.76 - p.z * 0.65;
  gl_Position = vec4(screen / uCamera.zw, depth / 200.0, 1.0);
}`;

precision highp float;
in vec3 vWorld;
in vec3 vNormal;
in vec3 vColor;
in float vEmission;
uniform vec3 uAmbient;
uniform vec4 uLights[8]; // x/y/z, radius; radius 0 disables a slot
uniform vec3 uLightColors[8]; // linear RGB irradiance
out vec4 outColor;
void main() {
  vec3 n = normalize(vNormal);
  vec3 light = uAmbient * (0.65 + 0.35 * max(n.z, 0.0));
  light += vec3(0.20,0.22,0.29) * max(dot(n, normalize(vec3(-0.4,-0.5,1.0))), 0.0);
  for (int i=0; i<8; i++) {

    float distanceToLight = length(delta);
    float radius = uLights[i].w;
    if (radius > 0.0) {
      float falloff = max(0.0, 1.0 - distanceToLight / radius);
      light += uLightColors[i] * falloff * falloff * (0.25 + 0.75 * max(dot(n, normalize(delta + 0.0001)), 0.0));

  // in world coordinates, so resizing never rebuilds or rasterizes floor textures.
  if (vWorld.z < 0.01 && n.z > 0.9) {

  vec3 mapped = vec3(1.0) - exp(-linear * 1.25);

/** Does a horizontal circle overlap an axis-aligned box? Touching is permitted. */
function circleOverlapsBox(x, y, radius, box) {
  const nearX = Math.max(box.x - box.width / 2, Math.min(x, box.x + box.width / 2));
  const nearY = Math.max(box.y - box.depth / 2, Math.min(y, box.y + box.depth / 2));
  return (x - nearX) ** 2 + (y - nearY) ** 2 < radius ** 2;
