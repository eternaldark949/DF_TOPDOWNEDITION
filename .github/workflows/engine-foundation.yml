# Verify the separate rewrite without changing the original game's build workflow.
name: Engine foundation

# Run when the foundation or its requirements change, including manual checks.
on:
  # Watch this branch while its architecture is being developed.
  push:
    # Restrict automatic runs to the explicitly created rewrite branch.
    branches: ['rewrite/engine-foundation']
    # Documentation-only changes elsewhere do not require these checks.
    paths: ['rewrite/**', 'AGENTS.md', 'CODE_REQUIREMENTS.md', '.github/workflows/engine-foundation.yml']
  # Check future proposals containing foundation changes too.
  pull_request:
    # Keep PR checks focused on the files this workflow validates.
    paths: ['rewrite/**', 'AGENTS.md', 'CODE_REQUIREMENTS.md', '.github/workflows/engine-foundation.yml']
  # Allow a repository owner to rerun foundation checks directly.
  workflow_dispatch:

# Testing requires repository read access only; this workflow writes no commits.
permissions:
  # Checkout needs read permission for repository contents.
  contents: read

# Define the independently runnable foundation check job.
jobs:
  # Name the job by the behavior it checks.
  foundation:
    # Use GitHub's Linux runner for Node's dependency-free checks.
    runs-on: ubuntu-latest
    # Bound a broken check instead of consuming unbounded runner time.
    timeout-minutes: 5
    # Execute checkout, runtime setup, build verification, and deterministic tests in order.
    steps:
      # Retrieve the exact commit being checked.
      - uses: actions/checkout@v4
      # Match the original repository's supported Node generation.
      - uses: actions/setup-node@v4
        # Configure the Node major version for subsequent commands.
        with:
          # Node 20 supports the standard-library APIs used by the build and checks.
          node-version: 20
      # Fail if someone changes source without rebuilding the one-file artifact.
      - name: Verify standalone artifact
        # Check mode compares bytes and does not modify the checkout.
        run: node rewrite/tools/build.mjs --check
      # Exercise scheduling, renderer, input, lifecycle, and failure behavior.
      - name: Verify foundation behavior
        # This runner requires no npm installation or browser downloads.
        run: node rewrite/tools/test-world.cjs
  # Pixel/event checks guard the renderer's actual geometry and lighting contract.
  browser:
    # Avoid expensive browser setup when dependency-free baseline checks already fail.
    needs: foundation
    # Linux runners use software WebGL for deterministic headless validation.
    runs-on: ubuntu-latest
    # Include time for a fresh browser/runtime installation without permitting endless waits.
    timeout-minutes: 15
    # Browser dependencies are test infrastructure only; the standalone artifact stays dependency-free.
    steps:
      # Retrieve the exact generated HTML and tests from this commit.
      - uses: actions/checkout@v4
      # Use the same Python generation as the local verification environment.
      - uses: actions/setup-python@v5
        # Runtime selection is explicit for reproducible test execution.
        with:
          # Python 3.12 supports the pinned Playwright driver used locally.
          python-version: '3.12'
      # Install the development-only browser driver at its recorded version.
      - name: Install browser test driver
        # Requirements are separate from runtime source and contain no game dependencies.
        run: python -m pip install -r rewrite/tools/requirements-browser.txt
      # Install a matching Chromium and the Linux libraries needed by its headless GPU path.
      - name: Install Chromium
        # Playwright manages this browser when the runner has no system Chromium executable.
        run: python -m playwright install --with-deps chromium
      # Verify original lifecycle, keyboard, touch, zoom, resize, and offline execution.
      - name: Check Canvas foundation behavior
        # The same HTML contains the Canvas-only study and the depth-aware world study.
        run: python rewrite/tools/test-browser.py
      # Verify real depth/emission pixels, source obstruction, large scene culling, and GPU recovery.
      - name: Check world geometry and lighting
        # All scene-specific test objects are neutral primitives, not migrated game content.
        run: python rewrite/tools/test-world-browser.py
