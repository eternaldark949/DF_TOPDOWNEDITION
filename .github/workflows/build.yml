name: Engine checks

# Checks the engine in src/engine: every level's tests, run with no game present, the real-canvas pixel
# tests in Chromium, the folder rules and the classic-code inventory. The classic game is frozen in
# "DFAB V8.html" and reference/classic, and is not rebuilt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium through Playwright (the pixel tests run in it)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Check the folder rules (src holds only the engine, classic code in reference/classic)
        run: node tools/check-layout.mjs

      - name: Check the engine (every level, standalone)
        run: node --test src/engine/tests/*.test.mjs src/engine/*/tests/*.test.mjs src/engine/basement/*/tests/*.test.mjs

      - name: Check the drawing on a real canvas
        run: node --test tools/test-art-pixels.mjs

      - name: Check the WebGL drawing against Canvas
        run: node --test tools/test-webgl-pixels.mjs

      - name: Check the migration inventory covers every classic script
        run: node tools/migration-inventory.mjs --check
