<!doctype html>
<!-- Studio shell: HTML properties surround the actual WebGL viewport; nothing paints a 2D canvas. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16151c"><title>ETRNLNINE Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#16151c;color:#e8e0d4;font:13px system-ui,sans-serif}button,input,select{font:inherit;color:inherit;background:#24222c;border:1px solid #59505b;border-radius:5px;min-height:40px;padding:7px 10px}button{cursor:pointer}button:hover,button[aria-pressed=true]{background:#534536;border-color:#c6a56c}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ddba7b;outline-offset:2px}header{height:112px;padding:13px 20px;border-bottom:1px solid #48404b;background:#1c1a22}header>div{display:flex;align-items:center;gap:10px}h1{font:24px Georgia,serif;margin:0 auto 0 0;letter-spacing:.03em}small,.eyebrow{color:#b7a584;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.projectbar{margin-top:12px}#project-name{margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b9b1c5}main{height:calc(100% - 146px);display:grid;grid-template-columns:216px minmax(0,1fr) 260px}aside{padding:17px 12px;overflow:auto;background:#1d1b24}#library{border-right:1px solid #48404b}#properties{border-left:1px solid #48404b}h2{font:20px Georgia,serif;font-weight:400;margin:8px 0 18px}h3{font-size:10px;font-weight:500;letter-spacing:.16em;color:#b7a584;text-transform:uppercase;margin:18px 0 9px}#hierarchy button{display:block;width:100%;text-align:left;background:transparent;border-color:transparent;min-height:36px;font-size:11px}#hierarchy button[aria-pressed=true]{background:#433a30;border-color:#8a7149}#hierarchy button[data-light=true]{color:#d3b17b}#assets p{font-size:11px;color:#aaa1b5;margin:12px 0}#stage{position:relative;min-width:0;overflow:hidden;background:#11121b}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}.tools{position:absolute;top:14px;left:14px;right:14px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}.tools>*{pointer-events:auto;background:#1d1a25dc;font-size:11px;min-height:38px}.view-label{position:absolute;bottom:16px;left:20px;pointer-events:none;color:#aea2bc;font-size:11px;letter-spacing:.06em}fieldset{border:0;border-top:1px solid #49414d;margin:14px 0 0;padding:12px 0;display:flex;gap:6px;min-width:0}legend{color:#baad98;font-size:11px;padding:0 6px 0 0}fieldset label{display:flex;flex:1;flex-direction:column;gap:6px;color:#a99cb4;font-size:10px;min-width:0}fieldset input{width:100%;padding:7px;font-size:12px}#selection-id{font-size:10px;color:#998fa5;overflow-wrap:anywhere}.note{color:#a99fb1;font-size:11px;line-height:1.8}footer{height:34px;padding:9px 17px;background:#211e28;border-top:1px solid #48404b;font-size:10px;color:#b8adbf;display:flex;gap:15px}#status{margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#error{position:absolute;bottom:40px;left:20px;right:20px;padding:16px;background:#522c35;border:1px solid #c58b91;z-index:9;cursor:pointer}#controls{position:absolute;inset:0;pointer-events:none}#controls>*{pointer-events:auto}.engine-joystick{position:absolute;left:25px;bottom:30px;border:1px solid #b8a17c88;border-radius:50%;background:#171724aa;touch-action:none;display:grid;place-items:center}.engine-joystick span{width:38px;height:38px;border-radius:50%;border:1px solid #cbb58a80;background:#7d6c4e80;pointer-events:none}.engine-action{position:absolute;right:25px;bottom:40px;border-radius:50%;padding:0;font-size:11px}#mobile-library,#mobile-properties{display:none}body.playing #library,body.playing #properties{opacity:.45;pointer-events:none}body.playing .tools{display:none}
.etrnl-profiler:not([open]){display:none}
@media(max-width:760px){header{height:115px;padding:10px}h1{font-size:20px}header button{padding:7px;font-size:11px}.projectbar{gap:4px;margin-top:9px}#scene{width:125px;min-width:0}header>div{gap:6px}header small{font-size:8px}.projectbar button{font-size:10px;padding:6px}#project-name{display:none}main{height:calc(100% - 149px);display:block}#stage{height:100%}#library,#properties{display:none;position:absolute;z-index:3;bottom:34px;left:0;right:0;border:1px solid #5d5262;max-height:44%;padding:12px 18px;background:#211e2bf5}body.library-open #library,body.properties-open:not(.playing) #properties{display:block}body.properties-open:not(.playing) #stage{height:56%}#properties{height:calc(44vh - 65.56px);max-height:none}#mobile-library,#mobile-properties{display:inline-block}.tools{left:9px;top:9px;right:9px;gap:4px}.tools>*{min-height:38px;padding:6px;font-size:10px}#properties h2{margin:3px 0 6px;font-size:20px}fieldset{margin-top:8px;padding:7px 0}.view-label{bottom:12px;left:15px;font-size:10px}footer{padding:9px;font-size:9px}#metrics{display:none}#assets{display:none}#hierarchy{display:grid;grid-template-columns:1fr 1fr}body.playing #library{display:none}}
</style></head><body class="properties-open">
<header><div><h1>ETRNLNINE <small>Studio</small></h1><button id="undo" title="Undo (Ctrl Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl Shift Z)">↷ Redo</button><button id="play">▶ Play</button></div><div class="projectbar"><span id="project-name"></span><select id="scene" aria-label="Scene"></select><button id="save">Export JSON</button><button id="open">Import</button><button id="recover">Recover</button><button id="profiler">Profiler</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<main><aside id="library"><div class="eyebrow">Directory</div><h2>Scene & assets</h2><div id="hierarchy"></div><section id="assets"><h3>Packaged assets</h3><div id="asset-list"></div></section></aside><section id="stage"><canvas id="world" tabindex="0" aria-label="Studio WebGL viewport. Tap to select; choose Move to drag on the ground plane."></canvas><nav class="tools" aria-label="Viewport tools"><button id="mobile-library">Directory</button><button id="mobile-properties">Properties</button><button id="select" aria-pressed="true">Select</button><button id="move" aria-pressed="false">Move</button><select id="view" aria-label="Camera view"><option value="oblique">Oblique</option><option value="top">Top</option><option value="front">Front</option><option value="side">Side</option></select><button id="orbit-left" aria-label="Orbit left">↶ View</button><button id="orbit-right" aria-label="Orbit right">View ↷</button><button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-out" aria-label="Zoom out">−</button><select id="snap" aria-label="Move snapping"><option value="0.5">Snap 0.5 m</option><option value="1">Snap 1 m</option><option value="0">No snap</option></select></nav><div class="view-label">AUTHORED WORLD / Z UP / METRES</div><div id="controls"></div></section><aside id="properties"><div class="eyebrow">Inspector</div><h2 id="selection-name"></h2><div id="selection-id"></div><div id="fields"></div><p class="note">Tap to select. Move drags on a horizontal plane. Numeric controls edit all three axes. Escape cancels an edit. Play uses a separate copy.</p></aside></main><footer><output id="status">Opening Studio…</output><output id="metrics"></output></footer><div id="error" role="alert" hidden title="Tap to dismiss"></div>
<script type="module" src="./main.js"></script></body></html>
